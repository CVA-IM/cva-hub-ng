name = "cva-hub-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# ============================================================
# Cloudflare D1 — relational database (SQLite via Drizzle ORM)
# ============================================================
[[d1_databases]]
binding = "DB"
database_name = "cva-hub-db"
database_id = "b3d92bc0-9d20-4c2a-827b-605f82d7c1d1"

# ============================================================
# Cloudflare R2 — object storage (file uploads, attachments)
# ============================================================
[[r2_buckets]]
binding = "FILES"
bucket_name = "cva-hub-uploads"

# ============================================================
# Cloudflare KV — session storage (Lucia auth sessions)
# ============================================================
[[kv_namespaces]]
binding = "SESSIONS"
id = "7a12222520c242bbbe7ac97d4c10e7ab"
